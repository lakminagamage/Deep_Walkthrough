name: Release — Publish & Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Build, push & release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create GitHub Release
      packages: write    # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for release notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────────────────────

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deep-walkthrough-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Frontend ─────────────────────────────────────────────────────────

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deep-walkthrough-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Images

            Images for this release are published to [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/deep-walkthrough-backend).

            ```bash
            # Backend
            docker pull ghcr.io/${{ github.repository_owner }}/deep-walkthrough-backend:${{ github.ref_name }}

            # Frontend
            docker pull ghcr.io/${{ github.repository_owner }}/deep-walkthrough-frontend:${{ github.ref_name }}
            ```

            ## Quick Start

            ```bash
            # clone the repo and copy the env template
            git clone https://github.com/${{ github.repository }}.git
            cd research_agent
            cp .env.example .env   # fill in OPENAI_API_KEY and TAVILY_API_KEY

            docker compose up
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/master/README.md) for full setup instructions.
